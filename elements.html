        <h1>🌎 Did You Know?</h1>
        <p>Welcome to the most <i>amazing</i> facts page on the internet! Get ready to have 
    your mind blown!

        <h2>🐙 Fact 1: The Amazing Octopus</h2>
        <p>Octopuses have three hearts, nine brains, and blue blood. Two hearts pump 
    blood to the gills, while the third pumps it to the rest of the body.

        <h3>🧠How Smart are Octopuses?</h3>
        <p>Octopuses can open jars, solve puzzles, and even recongnize human faces!
    Scientists consider them one of the most intelligent invertebrae on Earth.
        

        <h2>⚡️  Fact 2: Lightning Strikes<h2/>
        <p>Lightning strikes the Earth about 100 times every single second. That's
    roughly 8 million lightning strikes per day!

    <h3>🔥 How Hot is Lightning?</h3>
    <p>A single bolt of lightning is around 30,000 Kelvin <small>(approximately)</small>--five times hotter than
    the surface of the sun.</p>

    <h4>Can Lightning Strike Twice?</h4>
    <p> Yes! Lightning absoloutely can and does strike the same place more than once,
    especially on tall structures and trees.
